<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo giao ban | Khoa Ngoại Thần Kinh - Cột Sống (BVĐK Trung Tâm Tỉnh Gia Lai)</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Times+New+Roman&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ==========================================================================
       GIAO DIỆN BÁO CÁO GIAO BAN KHOA NGOẠI THẦN KINH - CỘT SỐNG
       ========================================================================== */
    :root {
      --gb-primary: #0284c7;
      --gb-primary-dark: #0369a1;
      --gb-accent: #2563eb;
      --gb-danger: #dc2626;
      --gb-warning: #d97706;
      --gb-success: #16a34a;
      --gb-purple: #7c3aed;
      --gb-bg: #f8fafc;
      --gb-card-bg: #ffffff;
      --gb-border: #cbd5e1;
      --gb-text: #0f172a;
      --gb-muted: #64748b;
    }

    body {
      background-color: var(--gb-bg);
      color: var(--gb-text);
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    /* Top control toolbar */
    .gb-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .gb-date-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 4px 10px;
    }

    .gb-date-input {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      padding: 4px 10px;
      color: #0f172a;
      background: #ffffff;
      outline: none;
    }

    .gb-btn-nav {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 5px 10px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .gb-btn-nav:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .gb-btn-today {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #0369a1;
      font-weight: 700;
    }
    .gb-btn-today:hover {
      background: #0369a1;
      color: #ffffff;
    }

    .gb-actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-gb-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .btn-gb-pptx {
      background: linear-content(135deg, #ea580c 0%, #c2410c 100%);
      background: #ea580c;
      color: #ffffff;
      border-color: #c2410c;
    }
    .btn-gb-pptx:hover {
      background: #c2410c;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
    }

    .btn-gb-present {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: #ffffff;
      border-color: #312e81;
    }
    .btn-gb-present:hover {
      background: linear-gradient(135deg, #4338ca 0%, #2e2677 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    .btn-gb-zalo {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
    .btn-gb-zalo:hover {
      background: #0369a1;
    }

    .btn-gb-print {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-gb-print:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .btn-gb-sync {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .btn-gb-sync:hover {
      background: #d1fae5;
      color: #065f46;
    }

    .btn-gb-save {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      border-color: #065f46;
    }
    .btn-gb-save:hover {
      background: linear-gradient(135deg, #047857 0%, #064e3b 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
    }

    /* Role & Room Tabs */
    .gb-tabs-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 18px;
      border-bottom: 2px solid #e2e8f0;
    }

    .gb-tab-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px 12px 0 0;
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      font-size: 0.92rem;
      border: 1px solid #e2e8f0;
      border-bottom: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .gb-tab-item:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .gb-tab-item.active {
      background: #ffffff;
      color: #0284c7;
      border-color: #cbd5e1;
      border-top: 3px solid #0284c7;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }

    .gb-tab-item.tab-master.active {
      color: #2563eb;
      border-top: 3px solid #2563eb;
    }

    .badge-tab-status {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .badge-tab-status.status-submitted {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Content Cards */
    .gb-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .gb-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .gb-card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Official Table 8 Cols (Bệnh cũ, Vào, Ra, Tử vong, Chuyển, Mổ, Hiện có, Bảo hiểm) */
    .official-census-card {
      background: #ffffff;
      border: 2px solid #0284c7;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.08);
    }

    .official-main-heading {
      font-family: 'Times New Roman', serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .official-sub-heading {
      font-family: 'Times New Roman', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 18px;
    }

    .official-table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 2px solid #0f172a;
    }

    .official-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Times New Roman', serif;
      font-size: 1.15rem;
      text-align: center;
      background: #ffffff;
    }

    .official-table th {
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 900;
      padding: 10px 8px;
      border: 1.5px solid #0f172a;
      white-space: nowrap;
    }

    .official-table td {
      padding: 10px 6px;
      border: 1.5px solid #0f172a;
      font-weight: 800;
      font-size: 1.35rem;
      color: #0f172a;
    }

    .official-num-input {
      width: 80px;
      text-align: center;
      font-family: 'Times New Roman', serif;
      font-weight: 900;
      font-size: 1.35rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px;
      background: #ffffff;
      outline: none;
    }
    .official-num-input:focus {
      border-color: #0284c7;
      background: #eff6ff;
    }

    /* Highlight Case Styles */
    .master-case-card {
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      background: #ffffff;
      transition: all 0.2s ease;
      position: relative;
    }
    .master-case-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
    }
    .master-case-card.border-xin-ve { border-left: 8px solid #991b1b; }
    .master-case-card.border-mo-cc { border-left: 8px solid #dc2626; }
    .master-case-card.border-theo-doi { border-left: 8px solid #d97706; }
    .master-case-card.border-mo-ve { border-left: 8px solid #2563eb; }

    .case-group-banner {
      font-family: 'Times New Roman', serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: #991b1b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .case-title-line {
      font-family: 'Times New Roman', serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .case-info-line {
      font-family: 'Times New Roman', serif;
      font-size: 1.08rem;
      color: #1e293b;
      margin-bottom: 5px;
    }

    .case-diag-line {
      font-family: 'Times New Roman', serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #0369a1;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    /* CT/MRI Attachment Box */
    .clinical-images-section {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .clinical-dropzone {
      background: #ffffff;
      border: 2px dashed #3b82f6;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      color: #2563eb;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .clinical-dropzone:hover {
      background: #eff6ff;
      border-color: #1d4ed8;
    }

    .clinical-gallery {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .clinical-thumb-box {
      width: 145px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      position: relative;
    }

    .clinical-thumb-img {
      width: 100%;
      height: 105px;
      object-fit: cover;
      cursor: zoom-in;
      display: block;
      background: #0f172a;
    }

    .clinical-thumb-meta {
      padding: 6px;
      font-size: 0.74rem;
      color: #334155;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-thumb-del {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(220, 38, 38, 0.85);
      color: #ffffff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .btn-thumb-del:hover {
      background: #dc2626;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox-modal.active {
      display: flex;
    }
    .lightbox-content-box {
      max-width: 92vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox-main-img {
      max-width: 90vw;
      max-height: 82vh;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      object-fit: contain;
    }
    .lightbox-caption {
      color: #f8fafc;
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 12px;
      text-align: center;
      font-family: 'Times New Roman', serif;
    }
    .lightbox-close-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #475569;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    /* ==========================================================================
       PRESENTATION THEATER MODE (DARK FULLSCREEN 16:9 SLIDES)
       ========================================================================== */
    .theater-mode {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: #090d16;
      color: #f1f5f9;
      flex-direction: column;
      overflow: hidden;
    }
    .theater-mode.active {
      display: flex;
    }

    .theater-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .theater-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theater-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .theater-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-theater {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-theater:hover {
      background: #334155;
    }
    .btn-theater-close {
      background: #991b1b;
      border-color: #b91c1c;
    }
    .btn-theater-close:hover {
      background: #dc2626;
    }

    .theater-slide-viewport {
      flex: 1;
      padding: 20px 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Official Slide 1 Layout in Theater Mode */
    .slide-official-box {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      padding: 30px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .slide-official-title {
      font-family: 'Times New Roman', serif;
      font-size: 2.8rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .slide-official-sub {
      font-family: 'Times New Roman', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 34px;
    }

    .slide-official-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Times New Roman', serif;
      font-size: 1.45rem;
      color: #f8fafc;
      background: #131d31;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    .slide-official-table th {
      background: #1e293b;
      color: #38bdf8;
      padding: 16px 8px;
      border: 1.5px solid #334155;
      font-weight: 900;
      font-size: 1.4rem;
    }
    .slide-official-table td {
      padding: 18px 8px;
      border: 1.5px solid #334155;
      font-weight: 900;
      font-size: 1.9rem;
      color: #f8fafc;
    }

    /* Official Patient Info Slide */
    .slide-patient-box {
      width: 100%;
      max-width: 1100px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 20px;
      padding: 40px;
      text-align: left;
      font-family: 'Times New Roman', serif;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .slide-pt-category {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ef4444;
      margin-bottom: 24px;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 14px;
    }

    .slide-pt-name-row {
      font-size: 1.95rem;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      gap: 30px;
      margin-bottom: 18px;
    }

    .slide-pt-detail {
      font-size: 1.4rem;
      color: #e2e8f0;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .slide-pt-diag {
      font-size: 1.55rem;
      font-weight: 800;
      color: #fde047;
      margin-top: 24px;
      line-height: 1.5;
      background: #131d31;
      padding: 16px 20px;
      border-radius: 12px;
      border-left: 6px solid #fde047;
    }

    /* Official Clinical Image Slide */
    .slide-image-fullscreen-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-full-img {
      max-width: 96vw;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #000000;
      cursor: zoom-in;
    }

    /* Print styles */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: 'Times New Roman', serif !important;
      }
      .dept-header-bar,
      .gb-top-bar,
      .gb-tabs-nav,
      .no-print {
        display: none !important;
      }
      .page-wrapper {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .official-census-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin-bottom: 14px !important;
      }
      .official-table {
        font-size: 10pt !important;
      }
      .official-table th, .official-table td {
        padding: 6px 4px !important;
      }
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- Official Department Header -->
    <header class="dept-header-bar">
      <div class="dept-brand">
        <a href="/" title="Về Trang chủ Khoa" style="display: flex; align-items: center; text-decoration: none;">
          <img src="logo.png" alt="Logo Khoa Ngoại Thần Kinh - Cột Sống" class="dept-logo-img" width="54" height="54" />
        </a>
        <div class="dept-brand-text">
          <div class="hospital-subtitle">BỆNH VIỆN ĐA KHOA TRUNG TÂM TỈNH GIA LAI</div>
          <h1 class="dept-main-title">KHOA NGOẠI THẦN KINH - CỘT SỐNG</h1>
        </div>
      </div>

      <!-- Right Header Group -->
      <div class="header-right-group">
        <a href="/" class="btn-tool-lookup" style="text-decoration: none;">
          ← Về Trang Chủ
        </a>
        <a href="/di-buong-hang-ngay" class="btn-tool-lookup" style="text-decoration: none;">
          🛏️ Đi Buồng
        </a>
        <a href="/hanh-chinh-khoa" class="btn-tool-lookup" style="text-decoration: none;">
          📋 Hành Chính
        </a>
        <div class="header-clock-box">
          <div class="header-clock-time" id="header-clock-time">00:00:00</div>
          <div class="header-clock-date" id="header-clock-date">--</div>
        </div>
      </div>
    </header>

    <!-- MAIN TOP TOOLBAR -->
    <div class="gb-top-bar no-print">
      <!-- Date Picker navigation -->
      <div class="gb-date-nav">
        <button type="button" class="gb-btn-nav" onclick="shiftDate(-1)" title="Lùi 1 ngày">◀ Hôm trước</button>
        <input type="date" id="gb-date-picker" class="gb-date-input" onchange="onDateChanged(this.value)" />
        <button type="button" class="gb-btn-nav" onclick="shiftDate(1)" title="Tiến 1 ngày">Ngày sau ▶</button>
        <button type="button" class="gb-btn-nav gb-btn-today" onclick="setToday()">Hôm nay</button>
      </div>

      <!-- Action Buttons -->
      <div class="gb-actions-group">
        <button type="button" class="btn-gb-action btn-gb-pptx" onclick="downloadPowerPointFile()" title="Tải file PowerPoint (.pptx) chuẩn 16:9 với đầy đủ slide và ảnh CT/MRI">
          <i class="fa-solid fa-file-powerpoint"></i> Tải PowerPoint (.pptx)
        </button>
        <button type="button" class="btn-gb-action btn-gb-present" onclick="openPresentationMode()" title="Bật màn hình trình chiếu giao ban toàn khoa">
          <i class="fa-solid fa-tv"></i> Trình chiếu giao ban
        </button>
        <button type="button" class="btn-gb-action btn-gb-zalo" onclick="copyBriefingTextForZalo()" title="Sao chép toàn bộ nội dung text để dán nhanh vào Zalo giao ban khoa">
          <i class="fa-solid fa-copy"></i> Sao chép cho Zalo
        </button>
        <button type="button" class="btn-gb-action btn-gb-sync" onclick="autoFetchFromHis()" title="Trích xuất số liệu mới nhất từ các file Excel HIS">
          <i class="fa-solid fa-arrows-rotate"></i> Lấy dữ liệu HIS
        </button>
        <button type="button" class="btn-gb-action btn-gb-save" onclick="saveActiveReport()" title="Lưu và nộp dữ liệu ca trực">
          <i class="fa-solid fa-floppy-disk"></i> Lưu báo cáo
        </button>
        <button type="button" class="btn-gb-action btn-gb-print" onclick="window.print()" title="In báo cáo A4 ngang chuẩn y tế">
          <i class="fa-solid fa-print"></i> In A4
        </button>
      </div>
    </div>

    <!-- ROLE & ROOM TABS -->
    <div class="gb-tabs-nav no-print" id="gb-tabs-container">
      <button type="button" class="gb-tab-item tab-master active" data-tab="overall" onclick="switchTab('overall')">
        <i class="fa-solid fa-user-doctor"></i> Toàn Khoa (Bác sĩ trực)
      </button>
      <button type="button" class="gb-tab-item" data-tab="tk1" onclick="switchTab('tk1')">
        <span class="badge-tab-status" id="tab-dot-tk1"></span> Thần kinh 1
      </button>
      <button type="button" class="gb-tab-item" data-tab="tk2" onclick="switchTab('tk2')">
        <span class="badge-tab-status" id="tab-dot-tk2"></span> Thần kinh 2
      </button>
      <button type="button" class="gb-tab-item" data-tab="tk3" onclick="switchTab('tk3')">
        <span class="badge-tab-status" id="tab-dot-tk3"></span> Thần kinh 3
      </button>
      <button type="button" class="gb-tab-item" data-tab="tk4" onclick="switchTab('tk4')">
        <span class="badge-tab-status" id="tab-dot-tk4"></span> Thần kinh 4
      </button>
      <button type="button" class="gb-tab-item" data-tab="hstk" onclick="switchTab('hstk')">
        <span class="badge-tab-status" id="tab-dot-hstk"></span> 🚨 Hồi sức TK (HSTK)
      </button>
    </div>

    <!-- MAIN DYNAMIC CONTENT AREA -->
    <div id="gb-view-container">
      <!-- Injected dynamically by JS -->
    </div>
  </div>

  <!-- LIGHTBOX MODAL FOR ZOOMING CLINICAL IMAGES -->
  <div id="lightbox-modal" class="lightbox-modal" onclick="closeLightbox(event)">
    <button type="button" class="lightbox-close-btn" onclick="closeLightbox()">&times;</button>
    <div class="lightbox-content-box" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Phim CT / MRI" class="lightbox-main-img" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- PRESENTATION THEATER OVERLAY (DARK FULLSCREEN) -->
  <div id="theater-modal" class="theater-mode">
    <div class="theater-top-bar">
      <div class="theater-brand">
        <img src="logo.png" width="34" height="34" alt="Logo" />
        <div>
          <div class="theater-title">BÁO CÁO GIAO BAN BUỔI SÁNG</div>
          <div style="font-size:0.8rem;color:#94a3b8;" id="theater-date-label">Khoa Ngoại Thần Kinh - Cột Sống</div>
        </div>
      </div>

      <div class="theater-controls">
        <span id="theater-slide-counter" style="font-weight: 800; color: #38bdf8; font-size: 0.95rem; margin-right: 8px;">
          Slide 1 / 1
        </span>
        <button type="button" class="btn-theater" onclick="prevSlide()" title="Phím tắt: Mũi tên trái">
          <i class="fa-solid fa-chevron-left"></i> Trước
        </button>
        <button type="button" class="btn-theater" onclick="nextSlide()" title="Phím tắt: Mũi tên phải">
          Sau <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" class="btn-theater" onclick="toggleTheaterFullscreen()">
          <i class="fa-solid fa-expand"></i> Toàn màn hình
        </button>
        <button type="button" class="btn-theater btn-theater-close" onclick="closePresentationMode()">
          <i class="fa-solid fa-xmark"></i> Thoát (Esc)
        </button>
      </div>
    </div>

    <div class="theater-slide-viewport" id="theater-viewport">
      <!-- Dynamic slide content -->
    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // Global State
    let currentDateKey = '2026-09-30'; // Default to the latest loaded briefing date
    let activeTab = 'overall'; // 'overall' | 'tk1' | 'tk2' | 'tk3' | 'tk4' | 'hstk'
    let currentReport = null;
    let doctorsList = [];
    let presentationSlides = [];
    let currentSlideIndex = 0;
    let activePasteCaseId = null;

    // Room Metadata
    const ROOM_NAMES = {
      tk1: 'Thần kinh 1',
      tk2: 'Thần kinh 2',
      tk3: 'Thần kinh 3',
      tk4: 'Thần kinh 4',
      hstk: 'Hồi sức thần kinh (HSTK)'
    };

    // Standard clinical categories in department
    const STANDARD_CATEGORIES = [
      'HSTK – BỆNH NẶNG XIN VỀ',
      'HSTK – BỆNH MỔ CẤP CỨU',
      'TK1 – BỆNH MỔ CẤP CỨU',
      'TK1 – BỆNH THEO DÕI',
      'TK2 – BỆNH MỔ VỀ TỪ CHỢ RẪY',
      'TK2 – BÊHT MỔ VỀ',
      'TK2 – BỆNH MỔ VỀ',
      'TK3 – BỆNH MỔ CẤP CỨU',
      'TK3 – BỆNH THEO DÕI',
      'TK4 – BỆNH MỔ CẤP CỨU',
      'TK4 – BỆNH THEO DÕI',
      'BỆNH NHÂN TỬ VONG'
    ];

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      initRealtimeClock();
      document.getElementById('gb-date-picker').value = currentDateKey;
      fetchBriefingReport(currentDateKey);
      setupGlobalPasteListener();
      setupKeyboardNavigation();
    });

    // Realtime Clock
    function initRealtimeClock() {
      const clockTime = document.getElementById('header-clock-time');
      const clockDate = document.getElementById('header-clock-date');

      function tick() {
        const now = new Date();
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dayStr = days[now.getDay()];
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        const hr = String(now.getHours()).padStart(2, '0');
        const mn = String(now.getMinutes()).padStart(2, '0');
        const sc = String(now.getSeconds()).padStart(2, '0');

        if (clockTime) clockTime.textContent = `${hr}:${mn}:${sc}`;
        if (clockDate) clockDate.textContent = `${dayStr}, ${d}/${m}/${y}`;
      }
      tick();
      setInterval(tick, 1000);
    }

    function formatDateDisplayVN(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `Ngày ${parts[2]} – ${parts[1]} – ${parts[0]}`;
      }
      return dateStr;
    }

    // Date Navigation
    function shiftDate(delta) {
      const d = new Date(currentDateKey);
      d.setDate(d.getDate() + delta);
      currentDateKey = d.toISOString().slice(0, 10);
      document.getElementById('gb-date-picker').value = currentDateKey;
      fetchBriefingReport(currentDateKey);
    }

    function setToday() {
      currentDateKey = new Date().toISOString().slice(0, 10);
      document.getElementById('gb-date-picker').value = currentDateKey;
      fetchBriefingReport(currentDateKey);
    }

    function onDateChanged(val) {
      if (!val) return;
      currentDateKey = val;
      fetchBriefingReport(currentDateKey);
    }

    // Tab Switcher
    function switchTab(tabKey) {
      activeTab = tabKey;
      document.querySelectorAll('.gb-tab-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tabKey);
      });
      renderCurrentView();
    }

    // Fetch report from Server
    async function fetchBriefingReport(dateKey) {
      try {
        const res = await fetch(`/api/briefing-report?date=${dateKey}`);
        const data = await res.json();
        if (data.ok && data.report) {
          currentReport = data.report;
          doctorsList = data.doctors || [];
          updateTabStatusDots();
          renderCurrentView();
        } else {
          alert('Không thể tải báo cáo giao ban: ' + (data.error || 'Lỗi server'));
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối khi tải dữ liệu giao ban!');
      }
    }

    // Update Dots on tabs
    function updateTabStatusDots() {
      if (!currentReport || !currentReport.roomReports) return;
      ['tk1', 'tk2', 'tk3', 'tk4', 'hstk'].forEach(rKey => {
        const dot = document.getElementById(`tab-dot-${rKey}`);
        const rep = currentReport.roomReports[rKey];
        if (dot && rep) {
          dot.classList.toggle('status-submitted', rep.status === 'SUBMITTED');
        }
      });
    }

    // Download PowerPoint file (.pptx)
    function downloadPowerPointFile() {
      const url = `/api/export-briefing-pptx?date=${currentDateKey}`;
      window.location.href = url;
    }

    // Copy formatted report text for Zalo
    function copyBriefingTextForZalo() {
      if (!currentReport) return;
      const overall = currentReport.overall || {};
      const grand = overall.grandCensus || {};
      const docsDuty = (overall.doctorsOnDuty && overall.doctorsOnDuty.length > 0)
        ? overall.doctorsOnDuty.join(' – ')
        : 'HẢI – CƯ – LUÂN – LƯƠNG';

      let text = `BÁO CÁO GIAO BAN\n`;
      text += `${formatDateDisplayVN(currentDateKey)}   BS:${docsDuty}\n\n`;
      text += `Bệnh cũ\tVào\tRa\tTử vong\tChuyển\tMổ\tHiện có\tBảo hiểm\n`;
      text += `${grand.benhCu || 0}\t${grand.vao || 0}\t${grand.ra || 0}\t${grand.tuVong || 0}\t${grand.chuyen || 0}\t${grand.mo || 0}\t${grand.hienCo || 0}\t${grand.bhyt || 0}\n\n`;

      const cases = currentReport.highlightCases || [];
      cases.forEach((c, idx) => {
        text += `${c.category || 'CA TRỌNG ĐIỂM'}\n`;
        text += `${c.stt || idx + 1}. ${c.hoten || ''}\t${c.tuoi || ''} tuổi\t${c.gioiTinh || 'NAM'}\n`;
        if (c.diaChi) text += `Địa chỉ: ${c.diaChi}\n`;
        if (c.ngayVaoVien) text += `Ngày vào viện : ${c.ngayVaoVien}\n`;
        if (c.ngayPhauThuat) text += `Ngày phẫu thuật: ${c.ngayPhauThuat}\n`;
        if (c.ngayXinVe) text += `Ngày xin về: ${c.ngayXinVe}\n`;
        text += `Chẩn đoán: ${c.chanDoan || ''}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        alert('📋 Đã sao chép nội dung Báo cáo giao ban vào Clipboard! Bạn có thể dán (Ctrl + V) ngay vào Zalo.');
      }).catch(() => {
        alert('Không thể sao chép tự động, vui lòng chọn và copy thủ công.');
      });
    }

    // Auto Fetch Fresh Draft From HIS
    async function autoFetchFromHis() {
      if (!confirm(`Bạn có chắc muốn đọc lại các file Excel HIS để làm mới số liệu cho ngày ${currentDateKey}? (Các ca đã gắn nhãn vẫn sẽ được bảo lưu)`)) {
        return;
      }
      try {
        const res = await fetch('/api/briefing-auto-fetch-his', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dateKey: currentDateKey, roomKey: activeTab })
        });
        const data = await res.json();
        if (data.ok) {
          alert('✅ Đã cập nhật thành công số liệu mới từ HIS!');
          await fetchBriefingReport(currentDateKey);
        } else {
          alert('Lỗi cập nhật HIS: ' + (data.error || 'Thao tác không thành công'));
        }
      } catch (e) {
        console.error(e);
        alert('Lỗi kết nối server khi lấy dữ liệu HIS!');
      }
    }

    // Save Active Report
    async function saveActiveReport() {
      if (!currentReport) return;
      try {
        let payload = { dateKey: currentDateKey, roomKey: activeTab };
        if (activeTab === 'overall') {
          payload.overall = currentReport.overall;
          payload.highlightCases = currentReport.highlightCases;
        } else {
          payload.roomReport = currentReport.roomReports[activeTab];
        }

        const res = await fetch('/api/briefing-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          alert('💾 Đã lưu thành công dữ liệu báo cáo giao ban!');
          currentReport = data.report;
          updateTabStatusDots();
          renderCurrentView();
        } else {
          alert('Lỗi lưu báo cáo: ' + (data.error || 'Server error'));
        }
      } catch (e) {
        console.error(e);
        alert('Lỗi kết nối khi lưu báo cáo!');
      }
    }

    // Render dispatcher
    function renderCurrentView() {
      const container = document.getElementById('gb-view-container');
      if (!currentReport) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;font-weight:700;">Đang tải dữ liệu báo cáo...</div>';
        return;
      }
      if (activeTab === 'overall') {
        renderOverallView(container);
      } else {
        renderRoomView(container, activeTab);
      }
    }

    /* =========================================================================
       1. OVERALL VIEW (BÁC SĨ TRỰC TOÀN KHOA) - CHUẨN MẪU BỆNH VIỆN
       ========================================================================= */
    function renderOverallView(container) {
      const overall = currentReport.overall || {};
      const grand = overall.grandCensus || {};
      const roomReports = currentReport.roomReports || {};
      const highlightCases = currentReport.highlightCases || [];

      const docsDutyStr = (overall.doctorsOnDuty && overall.doctorsOnDuty.length > 0)
        ? overall.doctorsOnDuty.join(' – ')
        : 'HẢI – CƯ – LUÂN – LƯƠNG';

      let html = `
        <!-- BẢNG 8 CHỈ SỐ GIAO BAN CHUẨN KHOA -->
        <div class="official-census-card">
          <div class="official-main-heading">BÁO CÁO GIAO BAN</div>
          <div class="official-sub-heading">
            ${formatDateDisplayVN(currentDateKey)} &nbsp;&nbsp;&nbsp; 
            BS: <input type="text" style="font-family:'Times New Roman',serif;font-weight:700;font-size:1.25rem;border:none;border-bottom:1px solid #94a3b8;width:340px;text-align:center;color:#0f172a;outline:none;" value="${escapeHtml(docsDutyStr)}" onchange="updateOverallField('doctorsOnDuty', this.value.split('–').map(s=>s.trim()).filter(Boolean))" />
          </div>

          <div class="official-table-wrap">
            <table class="official-table">
              <thead>
                <tr>
                  <th>Bệnh cũ</th>
                  <th>Vào</th>
                  <th>Ra</th>
                  <th>Tử vong</th>
                  <th>Chuyển</th>
                  <th>Mổ</th>
                  <th style="background:#fef3c7;color:#92400e;">Hiện có</th>
                  <th>Bảo hiểm</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><input type="number" class="official-num-input" value="${grand.benhCu || 0}" onchange="updateGrandCensusField('benhCu', this.value)" /></td>
                  <td><input type="number" class="official-num-input" style="color:#dc2626;" value="${grand.vao || 0}" onchange="updateGrandCensusField('vao', this.value)" /></td>
                  <td><input type="number" class="official-num-input" value="${grand.ra || 0}" onchange="updateGrandCensusField('ra', this.value)" /></td>
                  <td><input type="number" class="official-num-input" style="color:${Number(grand.tuVong || 0) > 0 ? '#dc2626' : '#0f172a'};" value="${grand.tuVong || 0}" onchange="updateGrandCensusField('tuVong', this.value)" /></td>
                  <td><input type="number" class="official-num-input" value="${grand.chuyen || 0}" onchange="updateGrandCensusField('chuyen', this.value)" /></td>
                  <td><input type="number" class="official-num-input" style="color:#dc2626;" value="${grand.mo || 0}" onchange="updateGrandCensusField('mo', this.value)" /></td>
                  <td style="background:#fffbeb;"><input type="number" class="official-num-input" style="color:#b45309;background:#fef3c7;font-size:1.5rem;" value="${grand.hienCo || 0}" onchange="updateGrandCensusField('hienCo', this.value)" /></td>
                  <td><input type="number" class="official-num-input" value="${grand.bhyt || 0}" onchange="updateGrandCensusField('bhyt', this.value)" /></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:0.85rem;color:#64748b;">💡 Số liệu trên có thể chỉnh sửa trực tiếp và sẽ tự động xuất ra file PowerPoint (.pptx).</span>
            <button type="button" class="btn-gb-action btn-gb-sync" style="padding:4px 12px;font-size:0.8rem;" onclick="recalcGrandTotalsFromRooms()">
              🔄 Tính lại tổng từ 5 phòng
            </button>
          </div>
        </div>

        <!-- DANH SÁCH CA TRỌNG ĐIỂM BÁO CÁO GIAO BAN -->
        <div class="gb-card">
          <div class="gb-card-header">
            <div class="gb-card-title">
              <i class="fa-solid fa-hospital-user" style="color:#dc2626;"></i> 
              DANH SÁCH CÁC CA TRỌNG ĐIỂM BÁO CÁO GIAO BAN (${highlightCases.length} ca)
            </div>
            <div class="gb-actions-group">
              <button type="button" class="btn-gb-action" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;" onclick="addNewMasterCase()">
                <i class="fa-solid fa-plus"></i> + Bác sĩ thêm ca giao ban
              </button>
            </div>
          </div>

          <div id="master-cases-list">
      `;

      if (highlightCases.length === 0) {
        html += `
          <div style="text-align:center;padding:32px;background:#f8fafc;border-radius:12px;border:1px dashed #cbd5e1;color:#64748b;">
            <i class="fa-solid fa-circle-check" style="font-size:2rem;color:#10b981;margin-bottom:8px;"></i>
            <div style="font-weight:700;">Chưa có ca trọng điểm nào cho ngày này.</div>
          </div>
        `;
      } else {
        highlightCases.forEach((c, idx) => {
          const borderClass = (c.category && c.category.includes('XIN VỀ')) ? 'border-xin-ve'
            : (c.category && c.category.includes('MỔ CẤP CỨU')) ? 'border-mo-cc'
            : (c.category && c.category.includes('THEO DÕI')) ? 'border-theo-doi' : 'border-mo-ve';

          const isSelectedForSlide = c.selectedForSlide !== false;

          html += `
            <div class="master-case-card ${borderClass}" id="case-card-${c.id}">
              <!-- DÒNG TIÊU ĐỀ NHÓM BỆNH -->
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
                <div class="case-group-banner">
                  <i class="fa-solid fa-folder-open"></i>
                  <input type="text" style="font-family:'Times New Roman',serif;font-size:1.35rem;font-weight:900;color:#990000;border:1px dashed #cbd5e1;padding:2px 8px;border-radius:6px;width:380px;background:#fff;" value="${escapeHtml(c.category || 'CA TRỌNG ĐIỂM')}" onchange="updateCaseField('${c.id}', 'category', this.value)" />
                </div>

                <div style="display:flex;align-items:center;gap:12px;">
                  <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:700;color:#1e40af;cursor:pointer;background:#eff6ff;padding:4px 10px;border-radius:8px;border:1px solid #bfdbfe;">
                    <input type="checkbox" ${isSelectedForSlide ? 'checked' : ''} onchange="toggleCaseSlide('${c.id}', this.checked)" />
                    📺 Chiếu slide giao ban
                  </label>
                  <button type="button" style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:0.8rem;" onclick="removeMasterCase('${c.id}')" title="Xóa ca này khỏi danh sách">
                    <i class="fa-solid fa-trash"></i> Xóa
                  </button>
                </div>
              </div>

              <!-- DÒNG HÀNH CHÍNH BỆNH NHÂN: STT, TÊN, TUỔI, GIỚI TÍNH -->
              <div class="case-title-line">
                <span>
                  STT: <input type="number" style="width:50px;font-family:'Times New Roman',serif;font-weight:800;font-size:1.2rem;border:1px solid #cbd5e1;border-radius:4px;text-align:center;" value="${c.stt || idx + 1}" onchange="updateCaseField('${c.id}', 'stt', this.value)" />.
                </span>

    /* =========================================================================
       3. EVENT HANDLERS & DATA MUTATIONS
       ========================================================================= */
    function updateOverallField(field, val) {
      if (!currentReport.overall) currentReport.overall = {};
      currentReport.overall[field] = val;
    }

    function updateGrandCensusField(field, val) {
      if (!currentReport.overall) currentReport.overall = {};
      if (!currentReport.overall.grandCensus) currentReport.overall.grandCensus = {};
      currentReport.overall.grandCensus[field] = Number(val) || 0;
    }

    function recalcGrandTotalsFromRooms() {
      if (!currentReport || !currentReport.roomReports) return;
      const r = currentReport.roomReports;
      let benhCu = 0, vao = 0, ra = 0, tuVong = 0, chuyen = 0, mo = 0, hienCo = 0, bhyt = 0;
      ['tk1', 'tk2', 'tk3', 'tk4', 'hstk'].forEach(k => {
        const c = (r[k] && r[k].census) || {};
        benhCu += Number(c.benhCu || 0);
        vao += Number(c.vao || (Number(c.vaoKK || 0) + Number(c.vaoKhac || 0)));
        ra += Number(c.ra || (Number(c.raRH || 0) + Number(c.raKhac || 0)));
        tuVong += Number(c.tuVong || 0);
        chuyen += Number(c.chuyen || Number(c.raKhac || 0));
        mo += Number(c.mo || (Number(c.moCT || 0) + Number(c.moCC || 0)));
        hienCo += Number(c.hienCo || 0);
        bhyt += Number(c.bhyt || 0);
      });
      currentReport.overall.grandCensus = { benhCu, vao, ra, tuVong, chuyen, mo, hienCo, bhyt };
      renderCurrentView();
    }

    function updateCaseField(caseId, field, val) {
      const c = (currentReport.highlightCases || []).find(item => item.id === caseId);
      if (c) {
        c[field] = val;
      }
    }

    function toggleCaseSlide(caseId, checked) {
      const c = (currentReport.highlightCases || []).find(item => item.id === caseId);
      if (c) {
        c.selectedForSlide = checked;
      }
    }

    function updateRoomPersonnel(roomKey, field, val) {
      const rep = currentReport.roomReports[roomKey];
      if (rep) {
        if (!rep.personnel) rep.personnel = {};
        rep.personnel[field] = (typeof rep.personnel[field] === 'number') ? Number(val) : val;
      }
    }

    function updateRoomCensus(roomKey, field, val) {
      const rep = currentReport.roomReports[roomKey];
      if (rep) {
        if (!rep.census) rep.census = {};
        rep.census[field] = Number(val) || 0;
      }
    }

    function updateRoomNotes(roomKey, val) {
      const rep = currentReport.roomReports[roomKey];
      if (rep) rep.criticalNotes = val;
    }

    // Toggle Tag from Room View
    function togglePatientTag(roomKey, patientId, category) {
      const rep = currentReport.roomReports[roomKey];
      if (!rep || !Array.isArray(rep.admissions)) return;

      const adm = rep.admissions.find(a => a.id === patientId);
      if (!adm) return;

      const prefix = roomKey.toUpperCase();
      const catText = (category === 'MO_CC') ? `${prefix} – BỆNH MỔ CẤP CỨU`
        : (category === 'THEO_DOI') ? `${prefix} – BỆNH THEO DÕI`
        : (category === 'TU_VONG') ? `${prefix} – BỆNH NHÂN TỬ VONG`
        : `${prefix} – BỆNH NẶNG XIN VỀ`;

      if (adm.category === category) {
        adm.category = '';
        adm.isHighlight = false;
        currentReport.highlightCases = (currentReport.highlightCases || []).filter(c => c.mabn !== adm.mabn || c.roomKey !== roomKey);
      } else {
        adm.category = category;
        adm.isHighlight = true;
        if (!Array.isArray(currentReport.highlightCases)) currentReport.highlightCases = [];
        let existing = currentReport.highlightCases.find(c => c.mabn === adm.mabn && c.roomKey === roomKey);
        if (!existing) {
          existing = {
            id: `case-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            stt: currentReport.highlightCases.length + 1,
            mabn: adm.mabn,
            hoten: adm.hoten,
            tuoi: adm.tuoi,
            gioiTinh: 'NAM',
            diaChi: adm.diaChi || 'Gia Lai',
            ngayVaoVien: currentDateKey,
            ngayPhauThuat: (category === 'MO_CC') ? currentDateKey : '',
            ngayXinVe: (category === 'XIN_VE') ? currentDateKey : '',
            roomKey: roomKey,
            roomName: ROOM_NAMES[roomKey],
            category: catText,
            chanDoan: adm.chanDoan,
            selectedForSlide: true,
            images: []
          };
          currentReport.highlightCases.push(existing);
        } else {
          existing.category = catText;
        }
      }

      renderCurrentView();
    }

    function addNewMasterCase() {
      const name = prompt('Nhập Họ và tên bệnh nhân:');
      if (!name) return;
      const cat = prompt('Nhập Tên nhóm phân loại (Ví dụ: HSTK – BỆNH MỔ CẤP CỨU, TK1 – BỆNH THEO DÕI...):', 'TK1 – BỆNH MỔ CẤP CỨU') || 'TK1 – BỆNH MỔ CẤP CỨU';
      const tuoi = prompt('Nhập Tuổi:') || '50';
      const gt = prompt('Giới tính (NAM hoặc NỮ):', 'NAM') || 'NAM';
      const diaChi = prompt('Địa chỉ:') || 'Gia Lai';
      const chanDoan = prompt('Chẩn đoán:') || 'Chấn thương sọ não';

      if (!Array.isArray(currentReport.highlightCases)) currentReport.highlightCases = [];
      currentReport.highlightCases.push({
        id: `case-${Date.now()}`,
        stt: currentReport.highlightCases.length + 1,
        mabn: `BN-${Date.now().toString().slice(-4)}`,
        hoten: name.trim().toUpperCase(),
        tuoi: tuoi.trim(),
        gioiTinh: gt.trim().toUpperCase(),
        diaChi: diaChi.trim(),
        ngayVaoVien: currentDateKey,
        ngayPhauThuat: cat.includes('MỔ') ? currentDateKey : '',
        ngayXinVe: cat.includes('XIN VỀ') ? currentDateKey : '',
        category: cat.trim(),
        chanDoan: chanDoan.trim(),
        selectedForSlide: true,
        images: []
      });

      renderCurrentView();
    }

    function removeMasterCase(caseId) {
      if (!confirm('Bạn có chắc muốn xoá ca này khỏi danh sách giao ban?')) return;
      currentReport.highlightCases = (currentReport.highlightCases || []).filter(c => c.id !== caseId);
      renderCurrentView();
    }

    async function submitRoomReport(roomKey) {
      const rep = currentReport.roomReports[roomKey];
      if (rep) {
        rep.status = 'SUBMITTED';
        rep.updatedAt = new Date().toISOString();
      }
      await saveActiveReport();
      alert(`🎉 Đã nộp thành công Báo cáo giao ban ${ROOM_NAMES[roomKey]} về Toàn Khoa!`);
    }

    /* =========================================================================
       4. CLINICAL IMAGES UPLOAD & CLIPBOARD (Ctrl+V) HANDLING
       ========================================================================= */
    function triggerFileUpload(caseId) {
      const input = document.getElementById(`file-input-${caseId}`);
      if (input) input.click();
    }

    function onFileSelected(e, caseId) {
      const file = e.target.files && e.target.files[0];
      if (file) {
        uploadClinicalImageFile(caseId, file);
      }
    }

    function handleDropFile(e, caseId) {
      e.preventDefault();
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        uploadClinicalImageFile(caseId, file);
      }
    }

    function setupGlobalPasteListener() {
      document.addEventListener('paste', async (e) => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;

        let imageFile = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            imageFile = items[i].getAsFile();
            break;
          }
        }

        if (imageFile) {
          let targetCaseId = activePasteCaseId;
          if (!targetCaseId && currentReport && currentReport.highlightCases && currentReport.highlightCases.length > 0) {
            targetCaseId = currentReport.highlightCases[0].id;
          }

          if (targetCaseId) {
            e.preventDefault();
            const targetCase = currentReport.highlightCases.find(c => c.id === targetCaseId);
            const promptTitle = prompt(`Dán ảnh CT/MRI vào ca [${targetCase ? targetCase.hoten : ''}]. Tiêu đề ảnh (ví dụ: CT Sọ não trước mổ):`, 'CT Sọ não');
            if (promptTitle !== null) {
              await uploadClinicalImageFile(targetCaseId, imageFile, promptTitle);
            }
          }
        }
      });
    }

    async function uploadClinicalImageFile(caseId, file, customTitle) {
      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64Data = event.target.result;
          const res = await fetch('/api/upload-clinical-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              caseId,
              dateKey: currentDateKey,
              fileName: file.name || 'clipboard.png',
              base64Data,
              title: customTitle || file.name || 'Phim cận lâm sàng',
              caption: ''
            })
          });
          const data = await res.json();
          if (data.ok && data.image) {
            const targetCase = (currentReport.highlightCases || []).find(c => c.id === caseId);
            if (targetCase) {
              if (!Array.isArray(targetCase.images)) targetCase.images = [];
              targetCase.images.push(data.image);
              renderCurrentView();
            }
          } else {
            alert('Lỗi tải ảnh: ' + (data.error || 'Server error'));
          }
        };
        reader.readAsDataURL(file);
      } catch (err) {
        console.error(err);
        alert('Lỗi khi xử lý tải hình ảnh!');
      }
    }

    async function deleteClinicalImage(caseId, imageId) {
      if (!confirm('Bạn có chắc muốn xoá hình ảnh này?')) return;
      try {
        const res = await fetch('/api/delete-clinical-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caseId, imageId, dateKey: currentDateKey })
        });
        const data = await res.json();
        if (data.ok) {
          const targetCase = (currentReport.highlightCases || []).find(c => c.id === caseId);
          if (targetCase && Array.isArray(targetCase.images)) {
            targetCase.images = targetCase.images.filter(img => img.id !== imageId);
            renderCurrentView();
          }
        }
      } catch (e) {
        console.error(e);
        alert('Lỗi kết nối khi xoá ảnh!');
      }
    }

    function openLightbox(url, title, caption) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      const cap = document.getElementById('lightbox-caption');
      img.src = url;
      cap.textContent = title ? `${title} ${caption ? '— ' + caption : ''}` : '';
      modal.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    /* =========================================================================
       5. PRESENTATION THEATER MODE (POWERPOINT EXACT REPLICA)
       ========================================================================= */
    function openPresentationMode() {
      if (!currentReport) return;
      buildPresentationSlides();
      currentSlideIndex = 0;
      renderCurrentSlide();
      document.getElementById('theater-modal').classList.add('active');
      document.getElementById('theater-date-label').textContent = `${formatDateDisplayVN(currentDateKey)} • Khoa Ngoại Thần Kinh - Cột Sống`;
    }

    function closePresentationMode() {
      document.getElementById('theater-modal').classList.remove('active');
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleTheaterFullscreen() {
      if (!document.fullscreenElement) {
        document.getElementById('theater-modal').requestFullscreen().catch(err => {
          alert(`Lỗi bật toàn màn hình: ${err.message}`);
        });
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function buildPresentationSlides() {
      presentationSlides = [];
      // Slide 1: Cover & 8-column Table
      presentationSlides.push({ type: 'COVER' });

      // Slide 2..N: Patient info slide followed by full image slides
      const cases = (currentReport.highlightCases || []).filter(c => c.selectedForSlide !== false);
      cases.forEach(c => {
        // Patient Info Slide
        presentationSlides.push({ type: 'PATIENT_INFO', data: c });
        // Fullscreen Image Slides
        const images = c.images || [];
        images.forEach(img => {
          presentationSlides.push({ type: 'PATIENT_IMAGE', patient: c, image: img });
        });
      });
    }

    function renderCurrentSlide() {
      const viewport = document.getElementById('theater-viewport');
      const counter = document.getElementById('theater-slide-counter');
      const totalSlides = presentationSlides.length;

      counter.textContent = `Slide ${currentSlideIndex + 1} / ${totalSlides}`;
      const slide = presentationSlides[currentSlideIndex];
      if (!slide) return;

      if (slide.type === 'COVER') {
        const overall = currentReport.overall || {};
        const grand = overall.grandCensus || {};
        const docsDutyStr = (overall.doctorsOnDuty && overall.doctorsOnDuty.length > 0)
          ? overall.doctorsOnDuty.join(' – ')
          : 'HẢI – CƯ – LUÂN – LƯƠNG';

        viewport.innerHTML = `
          <div class="slide-official-box">
            <div class="slide-official-title">BÁO CÁO GIAO BAN</div>
            <div class="slide-official-sub">
              ${formatDateDisplayVN(currentDateKey)} &nbsp;&nbsp;&nbsp;&nbsp; BS:${escapeHtml(docsDutyStr)}
            </div>

            <table class="slide-official-table">
              <thead>
                <tr>
                  <th>Bệnh cũ</th>
                  <th>Vào</th>
                  <th>Ra</th>
                  <th>Tử vong</th>
                  <th>Chuyển</th>
                  <th>Mổ</th>
                  <th style="color:#fde047;">Hiện có</th>
                  <th>Bảo hiểm</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${grand.benhCu || 0}</td>
                  <td style="color:#ef4444;">${grand.vao || 0}</td>
                  <td>${grand.ra || 0}</td>
                  <td style="color:${Number(grand.tuVong || 0) > 0 ? '#ef4444' : '#f8fafc'};">${grand.tuVong || 0}</td>
                  <td>${grand.chuyen || 0}</td>
                  <td style="color:#ef4444;">${grand.mo || 0}</td>
                  <td style="color:#fde047;font-size:2.4rem;">${grand.hienCo || 0}</td>
                  <td>${grand.bhyt || 0}</td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
      } else if (slide.type === 'PATIENT_INFO') {
        const c = slide.data;
        viewport.innerHTML = `
          <div class="slide-patient-box">
            <div class="slide-pt-category">${escapeHtml(c.category || 'CA TRỌNG ĐIỂM')}</div>
            <div class="slide-pt-name-row">
              <span>${c.stt || 1}. ${escapeHtml(c.hoten || '')}</span>
              <span>${c.tuoi || ''} tuổi</span>
              <span>${c.gioiTinh || 'NAM'}</span>
            </div>
            ${c.diaChi ? `<div class="slide-pt-detail"><strong>Địa chỉ:</strong> ${escapeHtml(c.diaChi)}</div>` : ''}
            <div class="slide-pt-detail"><strong>Ngày vào viện :</strong> ${c.ngayVaoVien || currentDateKey}</div>
            ${c.ngayPhauThuat ? `<div class="slide-pt-detail"><strong>Ngày phẫu thuật:</strong> ${c.ngayPhauThuat}</div>` : ''}
            ${c.ngayXinVe ? `<div class="slide-pt-detail"><strong>Ngày xin về:</strong> ${c.ngayXinVe}</div>` : ''}
            <div class="slide-pt-diag">
              <strong>Chẩn đoán:</strong> ${escapeHtml(c.chanDoan || '')}
            </div>
          </div>
        `;
      } else if (slide.type === 'PATIENT_IMAGE') {
        const c = slide.patient;
        const img = slide.image;
        viewport.innerHTML = `
          <div class="slide-image-fullscreen-box">
            <img src="${img.url}" class="slide-full-img" alt="Phim" onclick="openLightbox('${img.url}', '${escapeHtml(c.hoten)}', '${escapeHtml(img.title || '')}')" />
            <div style="font-family:'Times New Roman',serif;font-size:1.4rem;font-weight:700;color:#38bdf8;margin-top:12px;text-align:center;">
              ${escapeHtml(c.hoten)} (${c.tuoi || ''}T) — ${escapeHtml(img.title || 'Hình ảnh cận lâm sàng')}
            </div>
          </div>
        `;
      }
    }

    function nextSlide() {
      if (currentSlideIndex < presentationSlides.length - 1) {
        currentSlideIndex++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderCurrentSlide();
      }
    }

    function setupKeyboardNavigation() {
      document.addEventListener('keydown', (e) => {
        const isTheater = document.getElementById('theater-modal').classList.contains('active');
        if (isTheater) {
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            nextSlide();
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            prevSlide();
          } else if (e.key === 'Escape') {
            closePresentationMode();
          } else if (e.key === 'f' || e.key === 'F') {
            toggleTheaterFullscreen();
          }
        } else {
          if (e.key === 'Escape') {
            closeLightbox();
          }
        }
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
